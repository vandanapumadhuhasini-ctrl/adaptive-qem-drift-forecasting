# Stage 3 forecasting configuration (selection on validation only; PROTOCOL §3, §6)
window: 20
horizons: [1, 2, 4, 7]
targets: [log_t1, log_t2, log_sx_err, log_ro_err, log_cz_err_mean]
feature_set: state            # 19 calibration-state features (see src/data/windows.py)
seeds: [0, 1, 2, 3, 4]        # neural models: 5 seeds, the ensemble mean is the reported model
tune_seed: 0
bootstrap: {B: 10000, seed: 0}
large_change_log_threshold: 0.2231   # log(1.25): a >25 % change between decision and target

grids:
  ridge:
    alpha: [0.1, 1, 10, 100, 1000, 10000]
  hgb:
    learning_rate: [0.03, 0.1]
    max_iter: [200, 500]
    max_leaf_nodes: [15, 31]
    min_samples_leaf: [40]
    l2_regularization: [1.0]
  lstm:
    hidden: [32, 64]
    num_layers: [1, 2]
    dropout: [0.1, 0.3]
    lr: [0.001]
  transformer:
    d_model: [32, 64]
    num_layers: [1, 2]
    dropout: [0.1, 0.3]
    lr: [0.001, 0.0003]
    nhead: [4]
    dim_ff_mult: [2]

training: {max_epochs: 80, patience: 10, batch_size: 256, weight_decay: 0.0001}

# Transformer ablations, trained with the selected hyperparameters and all seeds
ablations:
  tf_targets_only: {feature_set: targets_only}
  tf_state_env: {feature_set: state_env}
  tf_no_positional: {positional: false}
