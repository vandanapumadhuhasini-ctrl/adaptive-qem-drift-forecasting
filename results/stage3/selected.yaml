ridge:
  k1/log_t1: &id003
    alpha: 100
  k1/log_t2: &id001
    alpha: 0.1
  k1/log_sx_err: &id002
    alpha: 1000
  k1/log_ro_err: *id001
  k1/log_cz_err_mean:
    alpha: 10000
  k2/log_t1: *id002
  k2/log_t2: *id001
  k2/log_sx_err: *id001
  k2/log_ro_err: &id004
    alpha: 10
  k2/log_cz_err_mean: *id003
  k4/log_t1: *id003
  k4/log_t2: *id001
  k4/log_sx_err: *id001
  k4/log_ro_err: *id003
  k4/log_cz_err_mean: *id001
  k7/log_t1: *id003
  k7/log_t2: *id001
  k7/log_sx_err: *id004
  k7/log_ro_err: *id004
  k7/log_cz_err_mean: *id001
hgb:
  k1/log_t1: &id005
    learning_rate: 0.03
    max_iter: 200
    max_leaf_nodes: 31
    min_samples_leaf: 40
    l2_regularization: 1.0
  k1/log_t2: &id006
    learning_rate: 0.03
    max_iter: 500
    max_leaf_nodes: 31
    min_samples_leaf: 40
    l2_regularization: 1.0
  k1/log_sx_err: *id005
  k1/log_ro_err: *id005
  k1/log_cz_err_mean: &id007
    learning_rate: 0.03
    max_iter: 200
    max_leaf_nodes: 15
    min_samples_leaf: 40
    l2_regularization: 1.0
  k2/log_t1: *id005
  k2/log_t2: *id006
  k2/log_sx_err: *id007
  k2/log_ro_err: *id005
  k2/log_cz_err_mean: *id007
  k4/log_t1: &id008
    learning_rate: 0.03
    max_iter: 500
    max_leaf_nodes: 15
    min_samples_leaf: 40
    l2_regularization: 1.0
  k4/log_t2: *id008
  k4/log_sx_err: *id005
  k4/log_ro_err: *id007
  k4/log_cz_err_mean: *id007
  k7/log_t1: *id008
  k7/log_t2:
    learning_rate: 0.1
    max_iter: 200
    max_leaf_nodes: 15
    min_samples_leaf: 40
    l2_regularization: 1.0
  k7/log_sx_err: *id007
  k7/log_ro_err: *id008
  k7/log_cz_err_mean: *id007
lstm:
  hidden: 32
  num_layers: 1
  dropout: 0.3
  lr: 0.001
  weight_decay: 0.0001
  batch_size: 256
transformer:
  d_model: 32
  num_layers: 1
  dropout: 0.1
  lr: 0.001
  nhead: 4
  weight_decay: 0.0001
  batch_size: 256
  dim_ff: 64
